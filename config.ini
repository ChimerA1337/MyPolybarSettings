[colors]
transparent = #00000000
secondary = #A0ADD8E6
primary = #D5FFFF
darkbg = #000000ff

[section/default]
enable-ipc = true
override-redirect = true
background = ${colors.darkbg}
height = 42
offset-y = 8
font-0 = "Paper Mono:size=15;3"
cursor-click = pointer
cursor-scroll = ns-resize
line-size = 1.9
border-size = 1.9
border-color = ${colors.secondary}
radius = 3

[settings]
screenchange-reload = false
format-padding = 0.5
format-margin = 1.2

# Making space for i3gaps
# ------------------------------------------ #
[bar/transparent]
enable-ipc = true
width = 100%
height = 52
background = ${colors.transparent}
modules-left = blank
[module/blank]
hidden = true
type = custom/text
format = <label>
format-background = ${colors.transparent}
label = " "
# ------------------------------------------ #

[bar/sysXworkspaces]
inherit = section/default
width = 800
offset-x = 100
modules-left = powermenu xworkspaces
separator = |

[bar/network]
inherit = section/default
width = 230
offset-x = 1100
modules-center = network

[bar/pulseaudio]
inherit = section/default
width = 180
offset-x = 1340
modules-center = pulseaudio

[bar/battery]
inherit = section/default
width = 110
offset-x = 1530
modules-center = battery

[bar/date]
inherit = section/default
width = 170
offset-x = 1650
modules-center = date

[module/powermenu]
type = custom/menu

label-open = " Sys "
label-open-foreground = ${colors.secondary}
label-close = "  X   " 
label-separator = |

menu-0-0 = "   Shutdown   "
menu-0-0-background = ${colors.darkbg}
menu-0-0-exec = ~/.config/scripts/shutdown.sh
menu-0-1 = "   Suspend   "
menu-0-1-exec = ~/.config/scripts/suspend.sh
menu-0-2 = "   Reboot "
menu-0-2-exec = ~/.config/scripts/reboot.sh

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-padding = 1

[module/network]
type = internal/network
interface = wlan0
interface-type = wireless
interval = 3.0
ping-interval = 3

format-connected = <label-connected>
label-connected = %signal%ms | %netspeed%
label-connected-foreground = ${colors.secondary}

format-disconnected = <label-disconnected>
label-disconnected = Disconnected
label-disconnected-foreground = ${colors.secondary}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "Vol: "
format-volume-prefix-foreground = ${colors.secondary}
format-volume = <label-volume>
label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.secondary}

click-right = pavucontrol

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP0

format = <label-charging>
label = %percentage%%

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d
label = %date%
label-foreground = ${colors.primary}